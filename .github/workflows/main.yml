name: Keep Supabase Alive - cometojesus

on:
  schedule:
    - cron: '0 0 */5 * *'  # 매 5일마다 실행 (UTC 자정)
  workflow_dispatch:        # 수동 실행 버튼도 활성화

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase DB (real activity)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://zulgjehxhoehaabhjlwa.supabase.co/rest/v1/books?select=id&limit=1")
          echo "HTTP Status: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Ping failed with status $RESPONSE"
            exit 1
          fi
          echo "✅ Supabase ping successful"
